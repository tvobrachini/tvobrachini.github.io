<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | Tiago Brachini</title>
    <meta http-equiv="refresh" content="4;url=/" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #0a0a0a;
        color: #ededed;
        font-family: system-ui, -apple-system, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }
      .container { max-width: 480px; }
      .code {
        font-size: 6rem;
        font-weight: 700;
        line-height: 1;
        background: linear-gradient(to right, #a855f7, #3b82f6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 16px;
      }
      h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 12px; }
      p { color: #6b7280; margin-bottom: 32px; line-height: 1.6; }
      a {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.1);
        color: #ededed;
        text-decoration: none;
        padding: 12px 24px;
        border-radius: 8px;
        font-weight: 500;
        transition: background 0.2s;
      }
      a:hover { background: rgba(255,255,255,0.1); }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="code">404</div>
      <h1>Page not found</h1>
      <p>This page doesn't exist. You'll be redirected to the homepage in a few seconds.</p>
      <a href="/">Go home</a>
    </div>
  </body>
</html>
